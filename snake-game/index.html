<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>Snake Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Lexend:wght@500;650;750&display=swap');

    :root {
      color-scheme: light dark;
      --page: #e9f1f4;
      --surface: #f9fcfd;
      --surface-2: #dce8eb;
      --ink: #10272b;
      --muted: #526b70;
      --line: #b7c9cd;
      --accent: #0d7d59;
      --accent-strong: #07563d;
      --accent-soft: #bde9d8;
      --board: #102a2c;
      --board-grid: #183638;
      --snake: #57dfa3;
      --snake-head: #d4ff78;
      --food: #ff6959;
      --shadow: 0 18px 50px rgba(31, 66, 70, .16);
      --danger: #b83a30;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #071315;
        --surface: #0d2023;
        --surface-2: #143033;
        --ink: #e9f6f4;
        --muted: #98b4b2;
        --line: #29484a;
        --accent: #5ce4a9;
        --accent-strong: #a9f5cf;
        --accent-soft: #143d31;
        --board: #061012;
        --board-grid: #102426;
        --snake: #4ddf9e;
        --snake-head: #d8ff7a;
        --food: #ff7165;
        --shadow: 0 24px 60px rgba(0, 0, 0, .38);
        --danger: #ff8177;
      }
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--page); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px),
        var(--page);
      background-size: 32px 32px;
      color: var(--ink);
      font-family: "Lexend", sans-serif;
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    button { font: inherit; }

    .game-shell {
      width: min(100%, 760px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 176px;
      gap: 20px;
      align-items: stretch;
    }

    .machine {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 28px 28px 18px 18px;
      padding: clamp(14px, 3vw, 22px);
      box-shadow: var(--shadow);
    }

    .hud {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
      font-family: "DM Mono", monospace;
    }

    .metric:last-child { text-align: right; }
    .metric-label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .13em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .metric-value {
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 500;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .status-light {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .status-light::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--line);
      box-shadow: 0 0 0 3px var(--surface-2);
    }
    .status-light[data-state="playing"]::before {
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft), 0 0 12px var(--accent);
    }
    .status-light[data-state="gameover"]::before { background: var(--food); }

    .board-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 14px;
      overflow: hidden;
      background: var(--board);
      border: 1px solid color-mix(in srgb, var(--line), transparent 35%);
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(3, 16, 17, .66);
      color: #f3fffd;
      transition: opacity .18s ease;
    }
    .overlay[hidden] { display: none; }
    .overlay-card {
      width: min(100%, 280px);
      text-align: center;
    }
    .overlay h1 {
      margin: 0 0 8px;
      color: #d9ff78;
      font-size: clamp(32px, 8vw, 52px);
      line-height: .95;
      letter-spacing: -.055em;
      text-transform: uppercase;
    }
    .overlay p {
      margin: 0 auto 20px;
      max-width: 28ch;
      color: #d0e2df;
      font: 400 13px/1.55 "DM Mono", monospace;
    }

    .primary {
      min-height: 48px;
      border: 0;
      border-radius: 10px;
      padding: 0 22px;
      background: #d9ff78;
      color: #102a2c;
      font-weight: 750;
      cursor: pointer;
      box-shadow: inset 0 -3px 0 rgba(16, 42, 44, .2);
    }
    .primary:active { transform: translateY(1px); box-shadow: inset 0 -1px 0 rgba(16, 42, 44, .2); }
    .primary:focus-visible, .control-btn:focus-visible, .action-btn:focus-visible {
      outline: 3px solid var(--food);
      outline-offset: 3px;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .panel-block {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(31, 66, 70, .08);
    }
    .panel-block h2 {
      margin: 0 0 12px;
      color: var(--muted);
      font: 500 10px/1.2 "DM Mono", monospace;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .dpad {
      width: 144px;
      height: 144px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
      touch-action: manipulation;
    }
    .control-btn {
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--ink);
      cursor: pointer;
      font-family: "DM Mono", monospace;
      font-size: 20px;
      line-height: 1;
      user-select: none;
      -webkit-user-select: none;
    }
    .control-btn:active, .control-btn.active { background: var(--accent-soft); color: var(--accent-strong); }
    .control-btn[data-dir="up"] { grid-column: 2; grid-row: 1; border-radius: 10px 10px 4px 4px; }
    .control-btn[data-dir="left"] { grid-column: 1; grid-row: 2; border-radius: 10px 4px 4px 10px; }
    .control-btn[data-dir="right"] { grid-column: 3; grid-row: 2; border-radius: 4px 10px 10px 4px; }
    .control-btn[data-dir="down"] { grid-column: 2; grid-row: 3; border-radius: 4px 4px 10px 10px; }
    .dpad-center {
      grid-column: 2;
      grid-row: 2;
      background: var(--accent);
      border-radius: 5px;
      position: relative;
    }
    .dpad-center::after {
      content: "";
      position: absolute;
      inset: 17px;
      border-radius: 50%;
      background: var(--accent-strong);
      opacity: .65;
    }

    .actions { display: grid; gap: 8px; }
    .action-btn {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-weight: 650;
    }
    .action-btn:hover { background: var(--surface-2); }
    .action-btn.restart { color: var(--danger); }

    .keys {
      margin: 0;
      color: var(--muted);
      font: 400 11px/1.55 "DM Mono", monospace;
    }
    kbd {
      display: inline-block;
      min-width: 22px;
      padding: 1px 5px;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 4px;
      color: var(--ink);
      background: var(--surface-2);
      font: inherit;
      text-align: center;
    }

    @media (max-width: 680px) {
      body { display: block; }
      .game-shell { grid-template-columns: 1fr; gap: 14px; max-width: 560px; margin: 0 auto; }
      .machine { border-radius: 22px 22px 14px 14px; }
      .side-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .panel-block { padding: 14px; }
      .help-block { display: none; }
      .dpad { width: 132px; height: 132px; }
      .actions { height: 100%; align-content: center; }
    }

    @media (max-width: 380px) {
      .hud { gap: 6px; }
      .status-light { font-size: 9px; gap: 5px; }
      .side-panel { grid-template-columns: 1fr; }
      .panel-block:first-child { padding-block: 10px; }
      .dpad { width: 126px; height: 126px; }
      .actions { grid-template-columns: 1fr 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="game-shell" aria-label="Snake arcade game">
    <section class="machine">
      <header class="hud" aria-label="Game statistics">
        <div class="metric">
          <span class="metric-label">Score</span>
          <strong class="metric-value" id="score">000</strong>
        </div>
        <div class="status-light" id="status" data-state="ready" aria-live="polite">Ready</div>
        <div class="metric">
          <span class="metric-label">Best this session</span>
          <strong class="metric-value" id="best">000</strong>
        </div>
      </header>

      <div class="board-wrap" id="boardWrap">
        <canvas id="game" width="600" height="600" aria-label="Snake game board"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-card">
            <h1 id="overlayTitle">Snake</h1>
            <p id="overlayText">Eat the red fruit. Avoid the walls — and your own tail.</p>
            <button class="primary" id="startButton" type="button">Start game</button>
          </div>
        </div>
      </div>
    </section>

    <aside class="side-panel" aria-label="Game controls">
      <section class="panel-block">
        <h2>Direction</h2>
        <div class="dpad" aria-label="Direction pad">
          <button class="control-btn" type="button" data-dir="up" aria-label="Move up">↑</button>
          <button class="control-btn" type="button" data-dir="left" aria-label="Move left">←</button>
          <span class="dpad-center" aria-hidden="true"></span>
          <button class="control-btn" type="button" data-dir="right" aria-label="Move right">→</button>
          <button class="control-btn" type="button" data-dir="down" aria-label="Move down">↓</button>
        </div>
      </section>

      <section class="panel-block actions" aria-label="Game actions">
        <button class="action-btn" id="pauseButton" type="button">Pause</button>
        <button class="action-btn restart" id="restartButton" type="button">Restart</button>
      </section>

      <section class="panel-block help-block">
        <h2>Keyboard</h2>
        <p class="keys"><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> to steer<br><kbd>Space</kbd> to pause</p>
      </section>
    </aside>
  </main>

  <script>
    (function () {
      "use strict";

      var canvas = document.getElementById("game");
      var ctx = canvas.getContext("2d");
      var overlay = document.getElementById("overlay");
      var overlayTitle = document.getElementById("overlayTitle");
      var overlayText = document.getElementById("overlayText");
      var startButton = document.getElementById("startButton");
      var pauseButton = document.getElementById("pauseButton");
      var restartButton = document.getElementById("restartButton");
      var scoreEl = document.getElementById("score");
      var bestEl = document.getElementById("best");
      var statusEl = document.getElementById("status");
      var boardWrap = document.getElementById("boardWrap");

      var COLS = 20;
      var ROWS = 20;
      var CELL = canvas.width / COLS;
      var snake = [];
      var food = { x: 14, y: 10 };
      var direction = { x: 1, y: 0 };
      var queuedDirection = { x: 1, y: 0 };
      var score = 0;
      var best = 0;
      var state = "ready";
      var lastTick = 0;
      var accumulator = 0;
      var animationId = 0;
      var touchStart = null;

      function css(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      function resetModel() {
        snake = [
          { x: 9, y: 10 },
          { x: 8, y: 10 },
          { x: 7, y: 10 },
          { x: 6, y: 10 }
        ];
        direction = { x: 1, y: 0 };
        queuedDirection = { x: 1, y: 0 };
        score = 0;
        updateScore();
        placeFood();
        accumulator = 0;
        lastTick = performance.now();
        draw();
      }

      function updateScore() {
        scoreEl.textContent = String(score).padStart(3, "0");
        bestEl.textContent = String(best).padStart(3, "0");
      }

      function setStatus(label, nextState) {
        statusEl.textContent = label;
        statusEl.dataset.state = nextState;
      }

      function setState(next) {
        state = next;
        if (next === "playing") {
          overlay.hidden = true;
          pauseButton.textContent = "Pause";
          setStatus("Playing", "playing");
          lastTick = performance.now();
        } else if (next === "paused") {
          overlay.hidden = false;
          overlayTitle.textContent = "Paused";
          overlayText.textContent = "Take a breath. Your snake will wait right here.";
          startButton.textContent = "Keep going";
          pauseButton.textContent = "Resume";
          setStatus("Paused", "paused");
        } else if (next === "gameover") {
          overlay.hidden = false;
          overlayTitle.textContent = "Game over";
          overlayText.textContent = score ? "You scored " + score + ". Ready for another run?" : "That was quick. Give it another run.";
          startButton.textContent = "Play again";
          pauseButton.textContent = "Pause";
          setStatus("Game over", "gameover");
        } else {
          setStatus("Ready", "ready");
        }
      }

      function startFresh() {
        resetModel();
        setState("playing");
        ensureLoop();
      }

      function placeFood() {
        var open = [];
        for (var y = 0; y < ROWS; y++) {
          for (var x = 0; x < COLS; x++) {
            var occupied = snake.some(function (part) { return part.x === x && part.y === y; });
            if (!occupied) open.push({ x: x, y: y });
          }
        }
        food = open[Math.floor(Math.random() * open.length)] || { x: 0, y: 0 };
      }

      function tickDelay() {
        return Math.max(70, 145 - Math.floor(score / 40) * 10);
      }

      function step() {
        direction = queuedDirection;
        var head = snake[0];
        var next = { x: head.x + direction.x, y: head.y + direction.y };
        var hitWall = next.x < 0 || next.x >= COLS || next.y < 0 || next.y >= ROWS;
        var willEat = next.x === food.x && next.y === food.y;
        var bodyToCheck = willEat ? snake : snake.slice(0, -1);
        var hitSelf = bodyToCheck.some(function (part) { return part.x === next.x && part.y === next.y; });

        if (hitWall || hitSelf) {
          if (navigator.vibrate) navigator.vibrate([35, 30, 70]);
          setState("gameover");
          return;
        }

        snake.unshift(next);
        if (willEat) {
          score += 10;
          best = Math.max(best, score);
          updateScore();
          placeFood();
          if (navigator.vibrate) navigator.vibrate(25);
        } else {
          snake.pop();
        }
      }

      function ensureLoop() {
        if (!animationId) animationId = requestAnimationFrame(loop);
      }

      function loop(now) {
        animationId = requestAnimationFrame(loop);
        if (state === "playing") {
          var delta = Math.min(now - lastTick, 250);
          lastTick = now;
          accumulator += delta;
          var delay = tickDelay();
          while (accumulator >= delay) {
            step();
            accumulator -= delay;
            if (state !== "playing") break;
          }
        } else {
          lastTick = now;
        }
        draw();
      }

      function roundedRect(x, y, w, h, r) {
        var radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
      }

      function draw() {
        var board = css("--board");
        var grid = css("--board-grid");
        var snakeColor = css("--snake");
        var headColor = css("--snake-head");
        var foodColor = css("--food");

        ctx.fillStyle = board;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = grid;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (var i = 1; i < COLS; i++) {
          var p = i * CELL + .5;
          ctx.moveTo(p, 0); ctx.lineTo(p, canvas.height);
          ctx.moveTo(0, p); ctx.lineTo(canvas.width, p);
        }
        ctx.stroke();

        var pulse = state === "playing" ? 1 + Math.sin(performance.now() / 130) * .04 : 1;
        var foodSize = CELL * .58 * pulse;
        var foodX = food.x * CELL + CELL / 2;
        var foodY = food.y * CELL + CELL / 2;
        ctx.fillStyle = foodColor;
        ctx.beginPath();
        ctx.arc(foodX, foodY, foodSize / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = headColor;
        ctx.fillRect(foodX + 3, foodY - foodSize / 2 - 3, 3, 6);

        snake.forEach(function (part, index) {
          var gap = index === 0 ? 3 : 4;
          var x = part.x * CELL + gap;
          var y = part.y * CELL + gap;
          var size = CELL - gap * 2;
          ctx.fillStyle = index === 0 ? headColor : snakeColor;
          roundedRect(x, y, size, size, index === 0 ? 7 : 5);
          ctx.fill();

          if (index === 0) {
            var eye1, eye2;
            if (direction.x !== 0) {
              var ex = direction.x > 0 ? x + size - 6 : x + 4;
              eye1 = { x: ex, y: y + 5 };
              eye2 = { x: ex, y: y + size - 7 };
            } else {
              var ey = direction.y > 0 ? y + size - 6 : y + 4;
              eye1 = { x: x + 5, y: ey };
              eye2 = { x: x + size - 7, y: ey };
            }
            ctx.fillStyle = board;
            ctx.fillRect(eye1.x, eye1.y, 3, 3);
            ctx.fillRect(eye2.x, eye2.y, 3, 3);
          }
        });
      }

      function steer(dirName) {
        var vectors = {
          up: { x: 0, y: -1 },
          down: { x: 0, y: 1 },
          left: { x: -1, y: 0 },
          right: { x: 1, y: 0 }
        };
        var next = vectors[dirName];
        if (!next) return;
        if (next.x === -direction.x && next.y === -direction.y) return;
        queuedDirection = next;

        var btn = document.querySelector('[data-dir="' + dirName + '"]');
        if (btn) {
          btn.classList.add("active");
          setTimeout(function () { btn.classList.remove("active"); }, 90);
        }
      }

      startButton.addEventListener("click", function () {
        if (state === "paused") setState("playing");
        else startFresh();
      });

      pauseButton.addEventListener("click", function () {
        if (state === "playing") setState("paused");
        else if (state === "paused") setState("playing");
      });

      restartButton.addEventListener("click", startFresh);

      document.querySelectorAll(".control-btn").forEach(function (button) {
        button.addEventListener("pointerdown", function (event) {
          event.preventDefault();
          steer(button.dataset.dir);
        });
      });

      window.addEventListener("keydown", function (event) {
        var keyMap = {
          ArrowUp: "up", w: "up", W: "up",
          ArrowDown: "down", s: "down", S: "down",
          ArrowLeft: "left", a: "left", A: "left",
          ArrowRight: "right", d: "right", D: "right"
        };
        if (keyMap[event.key]) {
          event.preventDefault();
          steer(keyMap[event.key]);
        } else if (event.code === "Space") {
          event.preventDefault();
          if (state === "playing") setState("paused");
          else if (state === "paused") setState("playing");
          else startFresh();
        } else if (event.key === "Enter" && state !== "playing") {
          event.preventDefault();
          if (state === "paused") setState("playing");
          else startFresh();
        }
      }, { passive: false });

      boardWrap.addEventListener("pointerdown", function (event) {
        touchStart = { x: event.clientX, y: event.clientY };
      });
      boardWrap.addEventListener("pointerup", function (event) {
        if (!touchStart) return;
        var dx = event.clientX - touchStart.x;
        var dy = event.clientY - touchStart.y;
        touchStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
        if (Math.abs(dx) > Math.abs(dy)) steer(dx > 0 ? "right" : "left");
        else steer(dy > 0 ? "down" : "up");
      });
      boardWrap.addEventListener("pointercancel", function () { touchStart = null; });

      var theme = window.matchMedia("(prefers-color-scheme: dark)");
      if (theme.addEventListener) theme.addEventListener("change", draw);

      resetModel();
      draw();
    }());
  </script>
</body>
</html>
